name: Tests

on:
  push:
    branches:
      - dev/cloudflare-modernization
  pull_request:
    branches:
      - main
      - dev/cloudflare-modernization

permissions:
  contents: read

jobs:
  unit-tests:
    name: Node.js characterization tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test
